<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f6f8">
<title>AI 데이터 리터러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 로그인 -->
<section id="login" class="login">
  <div class="login-card">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="40" height="40"><circle cx="24" cy="24" r="19" fill="none" stroke="#fff" stroke-width="3"/><path d="M24 9 L28 24 L24 39 L20 24 Z" fill="#fff" opacity=".95"/><circle cx="24" cy="24" r="3" fill="#007aff"/></svg>
    </div>
    <h1>AI 데이터 리터러시</h1>
    <p class="login-sub">내 사진, AI 그림의 주인은 누구일까?</p>
    <form id="loginForm" autocomplete="off">
      <input id="nameInput" class="field" maxlength="20" placeholder="이름을 입력하세요" required>
      <button class="btn primary wide" type="submit" id="loginBtn">참여하기</button>
    </form>
    <p class="login-hint">선생님은 이름 칸에 교사 코드를 입력하세요.</p>
    <p class="login-mode" id="modeBadge"></p>
  </div>
</section>

<!-- 앱 -->
<section id="app" class="app" hidden>
  <header class="chrome">
    <div class="chrome-left">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <button class="ico nav-btn teacher-only" id="prevBtn" title="이전 (←)"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ico nav-btn teacher-only" id="nextBtn" title="다음 (→)"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="address" id="address" title="">
      <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span id="addrHost"></span><span class="addr-path" id="addrPath"></span>
      <svg class="addr-grid teacher-only" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
    </div>
    <div class="chrome-right">
      <span class="conn" id="conn" title="연결 상태"></span>
      <span class="me-pill" id="mePill"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="stage">
    <div class="slide-col">
      <article class="slide" id="slide"></article>
      <div class="follow student-only">선생님이 화면을 넘기면 자동으로 따라가요</div>
    </div>
    <aside class="chat">
      <div class="chat-head">
        <div><div class="chat-title">의견</div><div class="chat-sub" id="chatSub"></div></div>
        <span class="count" id="chatCount">0</span>
      </div>
      <div class="chat-list" id="chatList"></div>
      <form class="chat-input" id="chatForm" autocomplete="off">
        <label class="img-btn" id="imgBtn" hidden title="이미지 올리기"><input type="file" accept="image/*" id="imgInput" hidden><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></label>
        <textarea id="chatText" rows="1" maxlength="500" placeholder="의견을 입력하세요"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </aside>
  </main>

  <!-- 교사 도구막대 -->
  <div class="toolbar teacher-only" id="toolbar">
    <button class="tb" id="tbPrev">‹</button>
    <span class="tb-count" id="tbCount">1 / 1</span>
    <button class="tb" id="tbNext">›</button>
    <span class="tb-sep"></span>
    <button class="tb text" id="tbLock">채팅 잠금</button>
    <button class="tb text" id="tbRoster">명단 <span id="rosterN">0</span></button>
    <button class="tb text" id="tbCsv">CSV</button>
    <button class="tb text danger" id="tbReset">초기화</button>
  </div>

  <div class="popover" id="roster" hidden>
    <div class="pop-head"><b>접속 명단</b><button class="ico" id="rosterClose">✕</button></div>
    <div class="pop-body" id="rosterBody"></div>
  </div>

</section>

<!-- 교사: 전체 목차 -->
<div class="overview" id="overview" hidden>
  <div class="ov-panel">
    <div class="ov-head"><div><b>전체 목차</b><span>슬라이드를 누르면 학생 화면도 함께 이동해요</span></div><button class="btn" id="ovClose">닫기</button></div>
    <div class="ov-body" id="ovBody"></div>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightImg" alt=""></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle"></h3><p id="modalText"></p>
    <div class="modal-actions"><button class="btn" id="modalCancel">취소</button><button class="btn danger" id="modalOk">확인</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/slides.js"></script>
<script src="js/backend.js"></script>
<script src="js/app.js"></script>
</body>
</html>
